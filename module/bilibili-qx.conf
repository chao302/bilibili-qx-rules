# bilibili 去广告（评论区修复版 · 推荐档）
# Fork 自 https://github.com/app2smile/rules
#
# 修复：移除对 bilibili.app.viewunite.v1.View/View 的 protobuf 重写。
#   该接口与评论接口 bilibili.main.community.reply.v1.Reply/MainList 在打开视频页时并发，
#   复用同一条 HTTP/2 连接；proto 脚本需全量缓冲响应体后用 JS 解析再重编码，
#   一旦超时或报错，代理会重置整条连接，评论流被一并杀掉 → 评论区一直转圈。
#
# 保留：开屏广告、推荐页信息流广告、「刷视频」竖屏广告、底栏(发布/会员购)、右上角游戏中心、动态页广告
# 失去：视频播放页「UP主推荐」位的广告

hostname = app.bilibili.com, grpc.biliapi.net

^https:\/\/app\.bilibili\.com\/x\/(v2\/(splash\/(list|show)|feed\/index(\/story)?\?)|resource\/show\/tab\/v2) url script-response-body https://raw.githubusercontent.com/chao302/bilibili-qx-rules/main/js/bilibili-json.js

^https:\/\/(grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.app\.dynamic\.v2\.Dynamic\/DynAll$ url script-response-body https://raw.githubusercontent.com/chao302/bilibili-qx-rules/main/js/bilibili-proto.js
