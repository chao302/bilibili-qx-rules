# bilibili 去广告（评论区修复版 · 保险档）
# Fork 自 https://github.com/app2smile/rules
#
# 修复：彻底移除所有 protobuf(gRPC) 重写，并把 MITM 范围收窄到 app.bilibili.com。
#   grpc.biliapi.net 完全不再被解密，评论与弹幕 gRPC 走原生直连，最稳。
#
# 保留：开屏广告、推荐页信息流广告、「刷视频」竖屏广告、底栏(发布/会员购)、右上角游戏中心
# 失去：视频播放页「UP主推荐」广告、动态页广告
#
# 用法：推荐档仍偶发评论区失败或明显变慢时，改用本文件。

hostname = app.bilibili.com

^https:\/\/app\.bilibili\.com\/x\/(v2\/(splash\/(list|show)|feed\/index(\/story)?\?)|resource\/show\/tab\/v2) url script-response-body https://raw.githubusercontent.com/chao302/bilibili-qx-rules/main/js/bilibili-json.js
